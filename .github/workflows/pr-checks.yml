name: PR checks

on: 
    pull_request:
        branches:
            - main

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            apartments-service-changed: ${{ steps.changes.apartments-service-changed }}
            apartments-mfe-changed: ${{ steps.changes.apartments-mfe-changed }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6
            -   name: Detect changes
                id: changes
                run:
                    if git diff --name-status main ${{ github.head_ref }} -- apartments-service; then
                        echo "apartments-service-changed=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "apartments-service-changed=true" >> "$GITHUB_OUTPUT"
                    fi

                    if git diff --name-status main ${{ github.head_ref }} -- apartments-mfe; then
                        echo "apartments-mfe-changed=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "apartments-mfe-changed=false" >> "$GITHUB_OUTPUT"
                    fi
    apartments-service-check:
        runs-on: ubuntu-latest
        needs: detect-changes
        if: needs.detect-changes.outputs.apartments-service-changed == 'true'
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6
            -   name: Setup golang
                uses: actions/setup-go@v5
                with:
                    go-version: '1.26'
                    cache: true
            -   name: Check format
                working-directory: apartments-service
                run:
                    if gofmt -l .; then
                        echo "Invalid format"
                        exit 1
                    fi
